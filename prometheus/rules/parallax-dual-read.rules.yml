groups:
  - name: parallax_dual_read
    interval: 30s
    rules:
      # user_id-stripped aggregate (same treatment issue #76 gave the canary
      # counters). parallax_dual_read_outcomes_total carries a high-cardinality
      # user_id label. rate()/increase() is computed PER SERIES and only then
      # summed, so a one-time user whose child series holds a single sample in
      # the range extrapolates to ~0 and is dropped — under-counting exactly
      # the sparse natural traffic the alerts below select on. Recording
      # `sum without (user_id) (...)` at the 30s group interval collapses
      # user_id into a stable, densely-sampled aggregate first; increase() over
      # THAT reflects every user's increment.
      #
      # `without (user_id)` rather than `by (...)` is deliberate on two counts.
      # It drops ONLY the high-cardinality label, so it keeps `outcome` and
      # `traffic_source` for the selectors below — and, load-bearing for the
      # per-instance alerting below, it keeps the `job` and `instance` labels
      # Prometheus attaches at scrape time. An explicit `by (...)` list would
      # silently drop scrape identity the first time someone forgot to list it.
      #
      # MUST stay above its consumers: rules in a group evaluate sequentially,
      # in order, so the aggregate has to be recorded before it is read.
      - record: parallax_dual_read_outcomes:sum_without_user_id
        expr: sum without (user_id) (parallax_dual_read_outcomes_total)

      - alert: CrosswalkMissRateHigh
        # Aggregated with sum() on both sides because miss_orphan_total carries
        # labels [user_id] while outcomes_total carries [user_id, outcome].
        # Without aggregation, PromQL drops series due to label-set mismatch
        # and the expression evaluates to no-data — the alert would never fire.
        # Global (tenant-wide) miss-rate is the correct semantic for this 5%
        # threshold; no per-user breakdown is needed for the alert.
        # Denominator guarded with `> 0` so the alert silently no-ops during
        # zero-traffic windows (DUAL_READ=false pre-flip / post-rollback)
        # instead of producing NaN. NaN comparison semantics differ across
        # Prometheus versions, so the explicit guard is safer than relying on
        # default behavior.
        #
        # STILL LATENT AFTER #101 — do not read this rule as live. #101 wired
        # the DENOMINATOR (parallax_dual_read_outcomes_total was incremented on
        # every outcome but never rendered by /metrics). The NUMERATOR remains
        # absent for a different and deeper reason: parallax_crosswalk_miss_orphan_total
        # is registered in parallax/router/crosswalk_backfill.py, a module no
        # code under parallax/ or scripts/ imports, and its only incrementer
        # record_orphan_miss() has no production call site — the lazy-crosswalk
        # miss path that was meant to call it was never wired up. So the
        # collector is not even in the default registry of a running server.
        # This alert therefore evaluates to no-data, NOT to a healthy 0.
        # Fixing it is producer work (call record_orphan_miss from the
        # crosswalk lookup path), deliberately out of scope for #101's
        # exposition-wiring change. Same for Grafana panels 3 and 4.
        expr: |
          (sum(rate(parallax_crosswalk_miss_orphan_total[5m]))
           /
           (sum(rate(parallax_dual_read_outcomes_total[5m])) > 0)) > 0.05
        for: 30m
        labels:
          severity: warning
          component: parallax_dual_read
        annotations:
          summary: Crosswalk miss rate above 5% for 30min
          description: |
            crosswalk_miss_rate has exceeded 5% for over 30 minutes.
            See runbook docs/lane-c/m3-dual-read-runbook.md §Failure-Modes.
            48h SLO observation window must restart if this fires during pre-flip phase.

      - alert: CircuitBreakerTripped
        expr: increase(parallax_circuit_breaker_tripped_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          component: parallax_dual_read
        annotations:
          summary: Dual-read circuit breaker tripped
          description: |
            The dual-read circuit breaker has tripped within the last 10 minutes.
            Investigate Aphelion availability and run POST /admin/circuit_breaker/reset
            once the underlying issue is resolved.

      - alert: DrainTimeoutDetected
        expr: increase(parallax_drain_timeout_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          component: parallax_dual_read
        annotations:
          summary: Graceful drain timeout occurred
          description: |
            Lifespan drain handler hit the 15-minute timeout — in-flight requests
            were force-cut. Investigate stuck connections or upstream blocks.

      # The three dual-read DoD gauges below are exposed by
      # parallax/server/routes/metrics.py partitioned by `traffic_source`
      # (`natural` | `synthetic` | `unknown`). All three alerts select
      # `natural` only, which is the Phase-2 semantic gate defined in
      # docs/m4-prep/traffic-gap-resolution.md §3.3 — the M4 burn-in
      # synthetic loader runs continuously and legitimately produces a 100%
      # arbitration-conflict rate (it queries claim ids present in neither
      # store), so an unpartitioned selector alerts on the loader forever.
      #
      # `unknown` is the pre-2026-08-02 backlog: decision records written
      # before the writer recorded traffic_source at all. That bucket is
      # closed-ended and drains out of the 72h window; it is deliberately
      # NOT alerted on, because its provenance is unaudited. Watch it via
      # parallax_dual_read_log_records_total{traffic_source="unknown"}.
      #
      # With no natural traffic the `natural` series is ABSENT rather than
      # 0.0, so these alerts sit in no-data instead of falsely reading
      # healthy. DualReadDecisionLogSilent below is what catches the case
      # where the whole corpus goes missing.
      - alert: DualReadDiscrepancyRateHigh
        expr: |
          max by (traffic_source) (parallax_dual_read_discrepancy_rate{traffic_source="natural"}) > 0.001
        for: 30m
        labels:
          severity: warning
          component: parallax_dual_read
        annotations:
          summary: Dual-read discrepancy rate above 0.1% for 30min
          description: |
            Dual-read discrepancy rate exceeded the 0.1% DoD threshold for 30 minutes.
            If sustained 60min consider rolling back DUAL_READ=false.

      # Alert threshold (1.5%) intentionally looser than 14-day corpus DoD
      # exit threshold (1%, see docs/m3-runbooks/observability-cookbook.md §2)
      # — alert is sized to avoid false positives during normal operation;
      # DoD threshold gates corpus exit. Both surface the same gauge.
      - alert: ArbitrationConflictRateHigh
        expr: |
          max by (traffic_source) (parallax_arbitration_conflict_rate{traffic_source="natural"}) > 0.015
        for: 1m
        labels:
          severity: warning
          component: parallax_dual_read
        annotations:
          summary: Arbitration conflict rate above 1.5% for 1min
          description: |
            arbitration_conflict_rate exceeded 1.5% for 1 minute. Investigate
            recent rule-table changes or upstream payload shape drift.
            Runbook: docs/m3-runbooks/observability-cookbook.md §5 場景 B.

      # Alert threshold (0.05%) intentionally looser than 14-day corpus DoD
      # exit threshold (0.02%) — see ArbitrationConflictRateHigh rationale above.
      - alert: DualReadWriteErrorRateHigh
        expr: |
          max by (traffic_source) (parallax_dual_read_write_error_rate{traffic_source="natural"}) > 0.0005
        for: 2m
        labels:
          severity: warning
          component: parallax_dual_read
        annotations:
          summary: Dual-read write error rate above 0.05% for 2min
          description: |
            dual_read_write_error_rate exceeded 0.05% for 2 minutes. Check
            primary write path and Aphelion bridge stub for raised exceptions.
            Runbook: docs/m3-runbooks/observability-cookbook.md §5 場景 A.

      # This alert exists to warn about a circuit-breaker trip, so it has to
      # measure what the breaker measures. It did not.
      #
      # Two bugs, fixed in two passes:
      #
      #   #101 — it selected a gauge that never reached the wire at all.
      #   discrepancy_live.py registered parallax_aphelion_unreachable_rate
      #   into the DEFAULT registry and set it on every outcome, but
      #   _build_payload serializes a fresh CollectorRegistry, so no scrape
      #   ever carried it. The rule matched nothing, forever.
      #
      #   #103 review — wiring it to the 72h DoD gauge fixed the wrong window.
      #   The breaker (parallax/router/circuit_breaker.py) trips on a 300s
      #   rolling window at 1% with >= 50 observations; the DoD gauge is a 72h
      #   corpus average. Those disagree in the exact scenario this alert is
      #   for: a sudden Aphelion outage against a large healthy 72h backlog
      #   trips the breaker while the 72h average stays well under 1%, so the
      #   warning never fires. It is a slow-moving gauge asked to detect a fast
      #   event.
      #
      # So this now computes a 300s ratio off the outcome counter, matching the
      # breaker term for term:
      #
      #   window       [5m]                    <- WINDOW_SECONDS = 300.0
      #   threshold    > 0.01                  <- TRIP_THRESHOLD = 0.01 (strict)
      #   sample floor >= 50 in-window         <- MIN_OBSERVATIONS = 50
      #   population   outcome!="skipped"      <- the _record() gate, below
      #   sources      ALL of them             <- the breaker cannot see them
      #   scope        by (job, instance)      <- the breaker is process-local
      #
      # WHICH OUTCOMES COUNT (#103 review P2-a). dual_read.py:499-505 feeds the
      # breaker from exactly one place:
      #
      #     if outcome != "skipped":
      #         get_breaker_state().record_unreachable_observation(
      #             observed_unreachable=(outcome == "aphelion_unreachable"))
      #
      # so the breaker's denominator is match | diverge | primary_only |
      # aphelion_unreachable, and its numerator is aphelion_unreachable. The
      # counter this alert reads is incremented by record_dual_read_outcome(),
      # whose ONLY call site is the same _record() a few lines above that gate
      # — so counter increments and breaker observations correspond 1:1 except
      # for `skipped`, and `outcome!="skipped"` reproduces the breaker's
      # population exactly rather than approximately.
      #
      # `skipped` is the DUAL_READ-disabled path and the CHANGE_TRACE
      # legacy_kind=bug short-circuit (dual_read.py:206, :235). Aphelion is
      # never called, so those requests cannot be evidence that Aphelion is
      # unreachable. Leaving them in inflates the denominator and can hold this
      # alert under 1% while the breaker, which never saw them, is over it.
      #
      # primary_only deliberately STAYS IN — do not "fix" it out. It is not
      # skipped, so it DOES feed the breaker (as a non-unreachable
      # observation). No bug-parity exclusions are encoded here: the selector
      # matches what the breaker actually counts today, not a workaround for
      # something it misses.
      #
      # NO traffic_source SELECTOR, AND THAT IS THE POINT (#103 review r3).
      # This alert is deliberately NOT natural-only, unlike the three DoD
      # alerts above. They answer different questions:
      #
      #   DoD alerts        "is natural traffic semantically healthy?"
      #                     -> {traffic_source="natural"}, because synthetic
      #                        burn-in numbers are not evidence about
      #                        production correctness (#100).
      #   this alert        "is a breaker about to cut this replica over to
      #                     canonical-only?"
      #                     -> every source, because the breaker counts every
      #                        source.
      #
      # record_unreachable_observation(*, observed_unreachable: bool) takes a
      # bool and nothing else; its deque is deque[tuple[float, bool]]; and
      # _record() never passes traffic_source to it. The breaker is therefore
      # traffic-source-blind by construction, and synthetic burn-in traffic
      # trips it exactly as readily as natural traffic does. Filtering to
      # natural here — which this rule did between the r1 and r3 review passes,
      # by reflex from the DoD convention — would let the M4 loader drive a
      # real trip while the warning stayed silent. A tripped breaker degrades
      # ALL traffic to canonical-only regardless of what tripped it, so the
      # warning must see what the breaker sees.
      #
      # Consequence worth knowing before deploy: while the burn-in loader runs,
      # this alert reports on loader traffic too. If it fires immediately on
      # deploy that is a TRUE POSITIVE about breaker state, not noise to be
      # filtered — and it is currently the only way to see it, because #102
      # leaves CircuitBreakerTripped unable to fire at all.
      #
      # PER-INSTANCE, NOT FLEET-WIDE (#103 review P2-b). BreakerState is
      # process-local (circuit_breaker.py — a singleton deque per process), so
      # each replica trips on its own traffic. A bare sum() collapses every
      # replica into one ratio, and one instance melting down gets diluted by
      # its healthy peers until the fleet average stays under 1% while that
      # replica has already tripped and is serving canonical-only. Aggregating
      # `by (job, instance)` on BOTH sides evaluates the same population each
      # breaker does, and keeps the label sets identical across the division so
      # the vector match stays 1:1. The firing alert then names the instance
      # that tripped.
      #
      # The recording rule keeps `traffic_source` as a label — other consumers
      # may want to slice on it, and one aggregate serving both is cleaner than
      # a second near-identical rule. Aggregating `by (job, instance)` here
      # sums it away, which is exactly the fleet-of-one-process population the
      # breaker holds in its deque.
      #
      # The `>= 50` denominator guard does double duty: it is the breaker's
      # cold-start flap guard AND the division-by-zero guard. Below 50
      # observations the comparison drops the sample and the alert is no-data
      # — deliberately NOT `or vector(0)`, because a fabricated 0 would read as
      # "measured, and healthy" on a window where nothing was measured. Same
      # absent-not-zero rule the gauges follow.
      #
      # for: 0m is the parity choice, not an oversight. The [5m] range IS the
      # breaker's window, so the smoothing is already in the expression; adding
      # a `for:` on top would delay the warning past the trip it is supposed to
      # precede. CircuitBreakerTripped uses for: 0m for the same reason.
      #
      # parallax_aphelion_unreachable_rate is NOT dead — it stays the 72h DoD
      # view on Grafana panel 2 and in the corpus exit criteria. It is simply
      # the wrong instrument for a 300s question. Two windows, two consumers.
      - alert: AphelionUnreachableRateHigh
        expr: |
          (
            sum by (job, instance) (
              increase(parallax_dual_read_outcomes:sum_without_user_id{outcome="aphelion_unreachable"}[5m])
            )
            /
            (
              sum by (job, instance) (
                increase(parallax_dual_read_outcomes:sum_without_user_id{outcome!="skipped"}[5m])
              ) >= 50
            )
          ) > 0.01
        for: 0m
        labels:
          severity: warning
          component: parallax_dual_read
        annotations:
          summary: Aphelion unreachable rate above 1% over 300s on {{ $labels.instance }} — circuit breaker tripping
          description: |
            aphelion_unreachable rate on instance {{ $labels.instance }}
            exceeded 1% over the same 300s window, 50-observation floor and
            outcome population (everything but "skipped") the dual-read circuit
            breaker trips on, so THAT replica's breaker is tripping now or is
            about to. New dual-read requests on it fall back to canonical-only
            once it does.
            The breaker is process-local, so this is a per-instance condition:
            healthy peers do NOT make it safe to ignore.
            ALL traffic sources are counted here, synthetic burn-in included,
            because the breaker itself is traffic-source-blind and a trip
            degrades every request on that replica no matter what caused it.
            Do not dismiss this as "just the loader" — check the breaker.
            The breaker is manual-reset ONLY: POST /admin/circuit_breaker/reset
            against that instance after Aphelion recovers. Note this alert
            RESOLVES on its own once the breaker opens — fallback stops
            producing aphelion_unreachable outcomes — so resolution here does
            NOT mean the breaker re-armed.
            CircuitBreakerTripped is the signal for the trip itself (and per
            #102 that alert's metric is itself never-on-the-wire).
            Runbook: docs/m3-runbooks/observability-cookbook.md §5.

      # Selecting {traffic_source="natural"} means the three DoD alerts go
      # quiet when there is no natural traffic — correct, but it removes the
      # only signal that the decision-log corpus is being read at all.
      # (AphelionUnreachableRateHigh is deliberately NOT in that set: it
      # matches the traffic-source-blind breaker, so it keeps reporting on
      # synthetic traffic. It is not a substitute for this alert either — it
      # watches the breaker, not the corpus.)
      # This alert is that signal. It covers two independent faults, and it
      # deliberately treats them differently.
      #
      # `dir_missing` is UNCONDITIONAL. A resolved log directory that does not
      # exist is a misconfiguration whether or not anything is querying. This
      # is the Gate-5 misdiagnosis (2026-07-26) encoded as an alert: an
      # investigation pointed at the wrong directory, measured zero records,
      # and concluded the exposition was stale.
      #
      # Silence is CONDITIONAL on there being traffic to be silent about.
      # The first version of this rule tested the 72h record COUNT for zero.
      # That cannot go true until a stopped writer's entire backlog ages out
      # of the window — a 72h detection latency on the very fault it claimed
      # to catch. It now compares record FRESHNESS against request activity
      # over the SAME 15m window: if dual-read requests were served in the
      # last 15 minutes but the newest decision record is older than that (or
      # there are no records at all), the writer is broken. Matching the two
      # windows is what keeps sparse natural traffic from false-positiving —
      # a request 14 minutes ago whose record landed 14 minutes ago is fresh
      # by exactly the same measure that counted the request.
      #
      # A QUIET SYSTEM IS NOT ALERTED ON, by design. Once the M4 burn-in
      # loader is stopped there is no traffic, so no new records is the
      # correct steady state; this rule must stay silent through the canary
      # closeout rather than become standing noise. `up == 0` owns the
      # scrape-down case.
      #
      # The traffic guard uses parallax_dual_read_requests_total, a counter
      # that exists for this alert: labelled by traffic_source only, never by
      # user_id, and incremented at request ENTRY — before the decision-log
      # write is attempted and outside its exception handling. Both properties
      # are load-bearing:
      #
      #   * No user_id. prometheus_client retains every label combination for
      #     the life of the process, so a user that queries once leaves a
      #     series pinned at 1 forever; increase() diffs last-minus-first and
      #     returns 0 for it, and there is no "series appeared" delta because
      #     Prometheus has no earlier sample. Summing increase() over a
      #     user_id-partitioned counter therefore reads ~0 under traffic made
      #     of mostly-unique users and SUPPRESSES this alert — which is what
      #     an earlier version of this rule did with parallax_aphelion_total.
      #   * Counted at entry. Attempts and successful log writes are separate
      #     signals and their divergence IS the alarm. A counter that only
      #     advanced on a successful write would go silent together with the
      #     writer it is supposed to be watching.
      - alert: DualReadDecisionLogSilent
        # `min without (traffic_source)` collapses only the partition label,
        # keeping job/instance, and takes the freshest partition — the log is
        # one file stream, so any partition advancing means the writer lives.
        expr: |
          parallax_dual_read_log_dir_missing > 0
          or (
            (
              min without (traffic_source) (parallax_dual_read_log_newest_record_age_seconds) > 900
              or absent(parallax_dual_read_log_newest_record_age_seconds)
            )
            and on() (sum(increase(parallax_dual_read_requests_total[15m])) > 0)
          )
        for: 15m
        labels:
          severity: warning
          component: parallax_dual_read
        annotations:
          summary: Dual-read decision log is missing, or not advancing under live traffic
          description: |
            Either the /metrics exposition resolved a dual-read decision-log
            directory that does not exist, or dual-read requests were served in
            the last 15 minutes while the newest decision record stayed older
            than that. Every dual-read DoD gauge is derived from that corpus,
            so they are all unmeasured — not healthy — while this fires.
            Check DUAL_READ_LOG_DIR on the service (systemd env, NOT the repo
            default), that the path is writable by the service unit, and that
            the disk is not full.
            A quiet system does not fire this: with no traffic, no new records
            is expected.
            Runbook: docs/m4-prep/stage-0-preflight-checklist.md §2.
