global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: zenbook-prod
    cluster: parallax

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:9093]

scrape_configs:
  - job_name: parallax
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8765]
        labels:
          service: parallax-server
          environment: prod
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [127.0.0.1:9093]
