# promtool rules unit tests for the parallax_dual_read group.
#
#   cases 1-8   AphelionUnreachableRateHigh          (#103 review)
#   cases 9-14  CircuitBreakerTripped     — CRITICAL (#102)
#   cases 15-19 DrainTimeoutDetected      — CRITICAL (#102)
#
# Run:  promtool test rules prometheus/tests/parallax-dual-read.test.yml
#
# Lives OUTSIDE prometheus/rules/ so the `promtool check rules` CI step (which
# globs prometheus/rules/**) does not try to parse this test file as a rule
# file. The `promtool test rules` CI step globs prometheus/tests/**/*.test.yml
# and picks this up with no workflow change.
#
# These are MUTATION-CHECKED, not merely passing: each alert expression was
# mutated one clause at a time (window narrowed, window widened, `> 0` loosened
# to `>= 0`, increase() dropped for a level test, labels aggregated away with
# sum()) and every mutant was confirmed to fail at least one case below. A
# green run therefore means the guards hold, not just that the YAML parses.
#
# What is under test — cases 1-8
# ------------------------------
# The alert exists to warn that the dual-read circuit breaker is tripping, so
# it must measure what the breaker measures. The breaker
# (parallax/router/circuit_breaker.py, fed at dual_read.py:499-505) is:
#
#     WINDOW_SECONDS   = 300.0            -> [5m] range
#     TRIP_THRESHOLD   = 0.01             -> > 0.01, strict
#     MIN_OBSERVATIONS = 50               -> >= 50 in-window denominator guard
#     population       = outcome != "skipped"
#     traffic source   = not a dimension  -> NO traffic_source selector
#     scope            = process-local    -> by (job, instance)
#
# Each case pins one of those terms, so CI asserts BEHAVIOUR and not just
# syntax. Every series carries job/instance because the alert aggregates by
# scrape identity; a test without them would not exercise that at all.
#
# Series shape note: parallax_dual_read_outcomes_total carries user_id, and the
# rule file records a `sum without (user_id)` aggregate first (issue #76). A
# per-series increase() would drop one-time users and under-count, which case 5
# pins directly.

rule_files:
  - ../rules/parallax-dual-read.rules.yml

evaluation_interval: 30s

tests:
  # -------------------------------------------------------------------------
  # 1. FIRES — the unreachable rate crosses 1% with a healthy sample size.
  #    Per 30s step: 5 unreachable, 95 match (split 60/35 across two users so
  #    the recorded aggregate has to sum more than one child). Over the 5m
  #    window that is ~50 unreachable of ~1000 total = ~5% > 1%, with the
  #    denominator far above the 50-observation floor.
  #    This is the case that pins the 1% threshold: loosen it and this stops
  #    firing.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: fires when the unreachable rate exceeds 1 percent over 300s
    input_series:
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+5x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+60x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u2",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+35x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AphelionUnreachableRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Aphelion unreachable rate above 1% over 300s on 10.0.0.1:8765 — circuit breaker tripping
              description: |
                aphelion_unreachable rate on instance 10.0.0.1:8765
                exceeded 1% over the same 300s window, 50-observation floor and
                outcome population (everything but "skipped") the dual-read circuit
                breaker trips on, so THAT replica's breaker is tripping now or is
                about to. New dual-read requests on it fall back to canonical-only
                once it does.
                The breaker is process-local, so this is a per-instance condition:
                healthy peers do NOT make it safe to ignore.
                ALL traffic sources are counted here, synthetic burn-in included,
                because the breaker itself is traffic-source-blind and a trip
                degrades every request on that replica no matter what caused it.
                Do not dismiss this as "just the loader" — check the breaker.
                The breaker is manual-reset ONLY: POST /admin/circuit_breaker/reset
                against that instance after Aphelion recovers. Note this alert
                RESOLVES on its own once the breaker opens — fallback stops
                producing aphelion_unreachable outcomes — so resolution here does
                NOT mean the breaker re-armed.
                CircuitBreakerTripped is the signal for the trip itself; since #102
                put its counter on the wire, that alert fires too. It clears ~10m
                after the trip when the increment ages out of its window, so
                neither alert going quiet means the breaker re-armed.
                Runbook: docs/m3-runbooks/observability-cookbook.md §5.

  # -------------------------------------------------------------------------
  # 2. SILENT below the threshold — 1 unreachable per ~1000 outcomes (0.1%),
  #    an order of magnitude under the 1% trip threshold, with a large sample.
  #    Guards against a regression that alerts on any unreachable at all.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: silent when the unreachable rate is below 1 percent
    input_series:
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+1x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+999x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AphelionUnreachableRateHigh
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 3. SILENT under the 50-observation floor — this is the breaker's
  #    MIN_OBSERVATIONS cold-start flap guard. The ratio here is ~33%, far over
  #    the threshold, but only ~30 outcomes landed in the window, so the
  #    breaker would NOT trip and neither may the alert. Without the `>= 50`
  #    guard this case fires and pages on statistical noise.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: silent when in-window sample size is under the 50 observation floor
    input_series:
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+1x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+2x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AphelionUnreachableRateHigh
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 4. #103 review r3 — a SYNTHETIC-driven breach must FIRE.
  #
  #    This case asserts the OPPOSITE of what it did between r1 and r3, and the
  #    reversal is the whole point. The breaker takes
  #    record_unreachable_observation(*, observed_unreachable: bool) — a bool,
  #    no traffic source — into a deque[tuple[float, bool]], and _record()
  #    never passes traffic_source to it. So the M4 burn-in loader trips the
  #    breaker exactly as readily as production traffic does, and a
  #    natural-only selector would sit silent through a real trip.
  #
  #    Here the loader runs 100 unreachable/step while natural traffic is
  #    perfectly healthy at 100 match/step: half of all attempted dual-reads on
  #    this replica are failing, its breaker is tripping, and the alert must
  #    say so. A natural-only selector computes 0/1000 = 0% and stays quiet —
  #    that regression is what this case exists to kill.
  #
  #    (The DoD alerts above stay natural-only. They ask whether natural
  #    traffic is semantically healthy, which is a different question.)
  # -------------------------------------------------------------------------
  - interval: 30s
    name: fires when synthetic burn-in traffic alone drives the breach
    input_series:
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="synthetic",user_id="parallax-burn-in-synth",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+100x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AphelionUnreachableRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Aphelion unreachable rate above 1% over 300s on 10.0.0.1:8765 — circuit breaker tripping
              description: |
                aphelion_unreachable rate on instance 10.0.0.1:8765
                exceeded 1% over the same 300s window, 50-observation floor and
                outcome population (everything but "skipped") the dual-read circuit
                breaker trips on, so THAT replica's breaker is tripping now or is
                about to. New dual-read requests on it fall back to canonical-only
                once it does.
                The breaker is process-local, so this is a per-instance condition:
                healthy peers do NOT make it safe to ignore.
                ALL traffic sources are counted here, synthetic burn-in included,
                because the breaker itself is traffic-source-blind and a trip
                degrades every request on that replica no matter what caused it.
                Do not dismiss this as "just the loader" — check the breaker.
                The breaker is manual-reset ONLY: POST /admin/circuit_breaker/reset
                against that instance after Aphelion recovers. Note this alert
                RESOLVES on its own once the breaker opens — fallback stops
                producing aphelion_unreachable outcomes — so resolution here does
                NOT mean the breaker re-armed.
                CircuitBreakerTripped is the signal for the trip itself; since #102
                put its counter on the wire, that alert fires too. It clears ~10m
                after the trip when the increment ages out of its window, so
                neither alert going quiet means the breaker re-armed.
                Runbook: docs/m3-runbooks/observability-cookbook.md §5.
    promql_expr_test:
      # Pin the premise: a natural-only selector really would have missed this.
      # Natural traffic here is 100% healthy, so its unreachable count is 0 and
      # a natural-scoped numerator has no series at all.
      - expr: |
          sum(increase(parallax_dual_read_outcomes:sum_without_user_id{traffic_source="natural",outcome="aphelion_unreachable"}[5m]))
          or vector(0)
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

  # -------------------------------------------------------------------------
  # 5. The user_id-stripping recording rule is load-bearing, not decoration.
  #    Five one-time users each emit a single outcome and then sit flat, which
  #    is what prometheus_client does with a retained label child. Per-series
  #    increase() sees a flat series and returns 0 for every one of them, so
  #    the OLD sum-of-increases idiom reads 0 and the alert can never fire on
  #    sparse traffic. The recorded aggregate counts all five.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: user_id stripped aggregate counts one-time users the raw counter drops
    input_series:
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '1+0x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u2",job="parallax",instance="10.0.0.1:8765"}'
        values: '_ _ 1+0x18'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u3",job="parallax",instance="10.0.0.1:8765"}'
        values: '_ _ _ _ 1+0x16'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u4",job="parallax",instance="10.0.0.1:8765"}'
        values: '_ _ _ _ _ _ 1+0x14'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u5",job="parallax",instance="10.0.0.1:8765"}'
        values: '_ _ _ _ _ _ _ _ 1+0x12'
    promql_expr_test:
      # The aggregate materialises all five one-time users as one series, keeps
      # job/instance (which the per-instance scoping depends on) and keeps
      # traffic_source (which other consumers may still want to slice on — this
      # alert aggregates it away rather than the rule dropping it).
      - expr: parallax_dual_read_outcomes:sum_without_user_id{outcome="match"}
        eval_time: 10m
        exp_samples:
          - labels: 'parallax_dual_read_outcomes:sum_without_user_id{outcome="match", traffic_source="natural", job="parallax", instance="10.0.0.1:8765"}'
            value: 5

      # The OLD idiom drops every one of them: each child is flat in range.
      - expr: sum(increase(parallax_dual_read_outcomes_total[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

      # The aggregate does not. `> bool` yields a deterministic 1 regardless of
      # increase()'s extrapolation, asserting "no longer under-counted".
      - expr: |
          sum(increase(parallax_dual_read_outcomes:sum_without_user_id[10m]))
          > bool
          sum(increase(parallax_dual_read_outcomes_total[10m]))
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  # -------------------------------------------------------------------------
  # 6. THE WINDOW REGRESSION CASE — a sudden outage against a large healthy
  #    backlog. This is the scenario the 72h DoD gauge structurally cannot see,
  #    and the reason this alert moved to a 300s window.
  #
  #    50 minutes of healthy traffic (200k matches, zero unreachable), then
  #    Aphelion falls over: matches stop, unreachables climb. At the end the
  #    LAST 300s is ~100% unreachable — the breaker is tripping — while the
  #    all-time ratio is only 1000/201000 ~= 0.5%, comfortably under the 1%
  #    threshold. A long-window expression reads healthy right through the
  #    outage. Widening [5m] back out must break this case.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: fires on a sudden outage that a long window would average away
    input_series:
      # Healthy for ~50m, then flat: the backlog a 72h average would drown in.
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+2000x100 200000+0x20'
      # Zero unreachable for ~50m, then the outage starts.
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x100 0+50x20'
    alert_rule_test:
      - eval_time: 60m
        alertname: AphelionUnreachableRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Aphelion unreachable rate above 1% over 300s on 10.0.0.1:8765 — circuit breaker tripping
              description: |
                aphelion_unreachable rate on instance 10.0.0.1:8765
                exceeded 1% over the same 300s window, 50-observation floor and
                outcome population (everything but "skipped") the dual-read circuit
                breaker trips on, so THAT replica's breaker is tripping now or is
                about to. New dual-read requests on it fall back to canonical-only
                once it does.
                The breaker is process-local, so this is a per-instance condition:
                healthy peers do NOT make it safe to ignore.
                ALL traffic sources are counted here, synthetic burn-in included,
                because the breaker itself is traffic-source-blind and a trip
                degrades every request on that replica no matter what caused it.
                Do not dismiss this as "just the loader" — check the breaker.
                The breaker is manual-reset ONLY: POST /admin/circuit_breaker/reset
                against that instance after Aphelion recovers. Note this alert
                RESOLVES on its own once the breaker opens — fallback stops
                producing aphelion_unreachable outcomes — so resolution here does
                NOT mean the breaker re-armed.
                CircuitBreakerTripped is the signal for the trip itself; since #102
                put its counter on the wire, that alert fires too. It clears ~10m
                after the trip when the increment ages out of its window, so
                neither alert going quiet means the breaker re-armed.
                Runbook: docs/m3-runbooks/observability-cookbook.md §5.
    promql_expr_test:
      # Pin the premise, so the case cannot silently stop testing what it says:
      # the all-time ratio really is under the 1% threshold. If this ever rises
      # above 0.01 the outage is no longer "averaged away" and case 6 would
      # pass for the wrong reason.
      - expr: |
          (
            sum(increase(parallax_dual_read_outcomes:sum_without_user_id{outcome="aphelion_unreachable"}[72h]))
            /
            sum(increase(parallax_dual_read_outcomes:sum_without_user_id{outcome!="skipped"}[72h]))
          ) < bool 0.01
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 1

  # -------------------------------------------------------------------------
  # 7. #103 review P2-a — `skipped` outcomes must NOT dilute the denominator.
  #    dual_read.py:501 gates the breaker on `outcome != "skipped"`, so the
  #    DUAL_READ-disabled path and the CHANGE_TRACE legacy_kind=bug
  #    short-circuit never reach Aphelion and never reach the breaker.
  #
  #    Attempted traffic here is 4 unreachable + 96 match per step = 4%, which
  #    the breaker sees and trips on. A flood of `skipped` at 900/step swamps
  #    it: counting those, the ratio falls to 4/1000 = 0.4% and the alert goes
  #    quiet while the breaker is tripping — precisely the P2-a failure.
  #    Putting `skipped` back in the denominator must break this case.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: skipped outcomes do not dilute the denominator the breaker never saw
    input_series:
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+4x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+96x20'
      # The dilutant: Aphelion was never called for any of these.
      - series: 'parallax_dual_read_outcomes_total{outcome="skipped",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+900x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AphelionUnreachableRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Aphelion unreachable rate above 1% over 300s on 10.0.0.1:8765 — circuit breaker tripping
              description: |
                aphelion_unreachable rate on instance 10.0.0.1:8765
                exceeded 1% over the same 300s window, 50-observation floor and
                outcome population (everything but "skipped") the dual-read circuit
                breaker trips on, so THAT replica's breaker is tripping now or is
                about to. New dual-read requests on it fall back to canonical-only
                once it does.
                The breaker is process-local, so this is a per-instance condition:
                healthy peers do NOT make it safe to ignore.
                ALL traffic sources are counted here, synthetic burn-in included,
                because the breaker itself is traffic-source-blind and a trip
                degrades every request on that replica no matter what caused it.
                Do not dismiss this as "just the loader" — check the breaker.
                The breaker is manual-reset ONLY: POST /admin/circuit_breaker/reset
                against that instance after Aphelion recovers. Note this alert
                RESOLVES on its own once the breaker opens — fallback stops
                producing aphelion_unreachable outcomes — so resolution here does
                NOT mean the breaker re-armed.
                CircuitBreakerTripped is the signal for the trip itself; since #102
                put its counter on the wire, that alert fires too. It clears ~10m
                after the trip when the increment ages out of its window, so
                neither alert going quiet means the breaker re-armed.
                Runbook: docs/m3-runbooks/observability-cookbook.md §5.
    promql_expr_test:
      # Pin the premise: counting `skipped` really would have hidden this.
      # 4 unreachable per 1000 total = 0.4%, under the 1% threshold.
      - expr: |
          (
            sum(increase(parallax_dual_read_outcomes:sum_without_user_id{outcome="aphelion_unreachable"}[5m]))
            /
            sum(increase(parallax_dual_read_outcomes:sum_without_user_id[5m]))
          ) < bool 0.01
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  # -------------------------------------------------------------------------
  # 8. #103 review P2-b — evaluate per scrape identity, because BreakerState is
  #    process-local: instance -2 trips on its own traffic no matter how -1 and
  #    -3 are doing.
  #
  #    -2 runs at 20% unreachable (its breaker is tripping); -1 and -3 are
  #    clean. The assertion is not merely "something fires" but that EXACTLY
  #    ONE alert fires and it is labelled instance -2. A bare sum() collapses
  #    job/instance into a single fleet-wide series, so it cannot name the
  #    failing replica and fails this case.
  # -------------------------------------------------------------------------
  - interval: 30s
    name: per instance evaluation names the failing replica and spares healthy peers
    input_series:
      # Healthy peers, high volume.
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.1:8765"}'
        values: '0+200x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.3:8765"}'
        values: '0+200x20'
      # Melting down: 20 unreachable of 100 per step = 20%.
      - series: 'parallax_dual_read_outcomes_total{outcome="aphelion_unreachable",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.2:8765"}'
        values: '0+20x20'
      - series: 'parallax_dual_read_outcomes_total{outcome="match",traffic_source="natural",user_id="u1",job="parallax",instance="10.0.0.2:8765"}'
        values: '0+80x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AphelionUnreachableRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.2:8765
            exp_annotations:
              summary: Aphelion unreachable rate above 1% over 300s on 10.0.0.2:8765 — circuit breaker tripping
              description: |
                aphelion_unreachable rate on instance 10.0.0.2:8765
                exceeded 1% over the same 300s window, 50-observation floor and
                outcome population (everything but "skipped") the dual-read circuit
                breaker trips on, so THAT replica's breaker is tripping now or is
                about to. New dual-read requests on it fall back to canonical-only
                once it does.
                The breaker is process-local, so this is a per-instance condition:
                healthy peers do NOT make it safe to ignore.
                ALL traffic sources are counted here, synthetic burn-in included,
                because the breaker itself is traffic-source-blind and a trip
                degrades every request on that replica no matter what caused it.
                Do not dismiss this as "just the loader" — check the breaker.
                The breaker is manual-reset ONLY: POST /admin/circuit_breaker/reset
                against that instance after Aphelion recovers. Note this alert
                RESOLVES on its own once the breaker opens — fallback stops
                producing aphelion_unreachable outcomes — so resolution here does
                NOT mean the breaker re-armed.
                CircuitBreakerTripped is the signal for the trip itself; since #102
                put its counter on the wire, that alert fires too. It clears ~10m
                after the trip when the increment ages out of its window, so
                neither alert going quiet means the breaker re-armed.
                Runbook: docs/m3-runbooks/observability-cookbook.md §5.

  # ===========================================================================
  # #102 — CircuitBreakerTripped and DrainTimeoutDetected.
  #
  # Both are severity: critical, and until #102 wired their counters onto
  # /metrics neither could ever fire — they evaluated against no-data forever.
  # Neither EXPRESSION was wrong, which is why nothing caught it for three
  # releases: a syntax check passes happily on a rule that selects a metric
  # nobody emits. These cases assert the alerts against synthetic series shaped
  # like the real exposition, so they fail if the exposition regresses OR if a
  # guard clause in the expression is loosened.
  #
  # LABEL PARITY WITH THE REAL EXPOSITION. Every series below carries job and
  # instance and NOTHING ELSE. That is derived, not guessed: both counters are
  # constructed with no labelnames (circuit_breaker.py:61, lifespan.py:50), and
  # tests/server/test_metrics_never_on_wire_102.py
  # ::test_series_carry_no_labels_beyond_scrape_identity scrapes the live
  # endpoint and asserts the label block is empty — leaving job/instance, which
  # Prometheus attaches at scrape time and no exporter can see, as the only
  # labels a real sample can carry. If someone adds a label to either counter,
  # that test fails first and points here.
  # ===========================================================================

  # -------------------------------------------------------------------------
  # 9. FIRES on a trip. The counter sits at 0 for 20m, then steps to 1.
  #    Evaluated 7m after the step, so the step is inside [10m] but OUTSIDE a
  #    hypothetical narrower window: mutate the range to [5m] and this stops
  #    firing. Pins the lower bound of the window.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: circuit breaker trip fires within the 10m window
    input_series:
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x20 1+0x20'
    alert_rule_test:
      - eval_time: 28m
        alertname: CircuitBreakerTripped
        exp_alerts:
          - exp_labels:
              severity: critical
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Dual-read circuit breaker tripped
              description: |
                The dual-read circuit breaker has tripped within the last 10 minutes.
                Investigate Aphelion availability and run POST /admin/circuit_breaker/reset
                once the underlying issue is resolved.

  # -------------------------------------------------------------------------
  # 10. SILENT when the breaker has never tripped. increase() over a flat-zero
  #     counter is 0, and 0 > 0 is false. Mutate the comparison to >= 0 and
  #     this fires on every healthy replica forever — the mutant this case
  #     exists to kill.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: circuit breaker silent when never tripped
    input_series:
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CircuitBreakerTripped
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 11. SILENT once the trip has aged out of the window. Same series as case 9,
  #     evaluated 20m after the step. Kills TWO mutants at once:
  #       * widening the range ([30m], [1h]) — the step re-enters the window
  #         and this fires;
  #       * dropping increase() for a level test
  #         (parallax_circuit_breaker_tripped_total > 0) — a monotonic counter
  #         never returns to 0, so that fires forever after the first trip and
  #         the alert becomes permanent noise nobody can clear. reset()
  #         deliberately does NOT decrement the counter (circuit_breaker.py
  #         reset() docstring), so this is a real mutant, not a theoretical one.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: circuit breaker silent once the trip ages out of the window
    input_series:
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x20 1+0x20'
    alert_rule_test:
      - eval_time: 41m
        alertname: CircuitBreakerTripped
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 12. THE EXPOSITION CONTRACT, stated as an alert test.
  #
  #     Here the counter is ABSENT until its first increment and then springs
  #     into existence already at 1.0 — exactly what "absent-not-zero", applied
  #     to this counter by analogy with the DoD gauges, would produce.
  #
  #     The alert NEVER FIRES. Every sample in the window is 1.0, so increase()
  #     reports 0 and the trip reads as "measured, and healthy". The breaker is
  #     manual-reset, so there is no second edge coming to save it either: the
  #     replica sits degraded to canonical-only and nothing pages.
  #
  #     This is why /metrics exports these counters FROM ZERO rather than on
  #     first observation (parallax/server/routes/metrics.py, the #102 block at
  #     the bottom of _build_payload). Change that and case 9 keeps passing
  #     while production goes silent — this case is the one that notices.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: absent-until-first-increment counter cannot fire the trip alert
    input_series:
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '_x20 1+0x20'
    alert_rule_test:
      - eval_time: 22m
        alertname: CircuitBreakerTripped
        exp_alerts: []
      - eval_time: 25m
        alertname: CircuitBreakerTripped
        exp_alerts: []
      - eval_time: 28m
        alertname: CircuitBreakerTripped
        exp_alerts: []
      - eval_time: 35m
        alertname: CircuitBreakerTripped
        exp_alerts: []
    promql_expr_test:
      # Not no-data — a flat, confident zero. That is what makes it dangerous.
      - expr: increase(parallax_circuit_breaker_tripped_total[10m])
        eval_time: 25m
        exp_samples:
          - labels: '{instance="10.0.0.1:8765", job="parallax"}'
            value: 0

  # -------------------------------------------------------------------------
  # 13. PER-INSTANCE. BreakerState is process-local (a singleton deque per
  #     process), so one replica tripping says nothing about its peers. The
  #     expression aggregates nothing, which is correct here — and must stay
  #     that way. A sum() "tidy-up" would collapse both replicas into one
  #     unlabelled alert that cannot name the instance an operator has to POST
  #     the manual reset to.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: circuit breaker names the tripping replica and spares healthy peers
    input_series:
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x20 1+0x20'
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.2:8765"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 28m
        alertname: CircuitBreakerTripped
        exp_alerts:
          - exp_labels:
              severity: critical
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Dual-read circuit breaker tripped
              description: |
                The dual-read circuit breaker has tripped within the last 10 minutes.
                Investigate Aphelion availability and run POST /admin/circuit_breaker/reset
                once the underlying issue is resolved.

  # -------------------------------------------------------------------------
  # 14. A SECOND trip after an operator reset still fires. reset() clears the
  #     breaker state but deliberately does NOT decrement the counter, so the
  #     second trip is a 1 -> 2 step rather than a 0 -> 1 one. An expression
  #     that only recognised the first edge would leave every subsequent
  #     incident unpaged.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: circuit breaker fires again on a second trip after reset
    input_series:
      - series: 'parallax_circuit_breaker_tripped_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x20 1+0x20 2+0x20'
    alert_rule_test:
      - eval_time: 49m
        alertname: CircuitBreakerTripped
        exp_alerts:
          - exp_labels:
              severity: critical
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Dual-read circuit breaker tripped
              description: |
                The dual-read circuit breaker has tripped within the last 10 minutes.
                Investigate Aphelion availability and run POST /admin/circuit_breaker/reset
                once the underlying issue is resolved.

  # -------------------------------------------------------------------------
  # 15. DRAIN TIMEOUT FIRES within the 1h window. Counter steps at 61m,
  #     evaluated at 90m — 29 minutes later, so the step is inside [1h] but far
  #     outside the breaker's [10m]. Mutate the range down to [10m] and this
  #     stops firing.
  #
  #     The wide window is not a copy-paste slip: the drain timeout increments
  #     as the LAST act of a dying process, so the alert needs a window wide
  #     enough that a scrape lands after the increment and the alert is still
  #     firing when a human looks.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: drain timeout fires within the 1h window
    input_series:
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x60 1+0x60'
    alert_rule_test:
      - eval_time: 90m
        alertname: DrainTimeoutDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Graceful drain timeout occurred
              description: |
                Lifespan drain handler hit the 15-minute timeout — in-flight requests
                were force-cut. Investigate stuck connections or upstream blocks.
                KNOWN LATENT (#102 review, re-measured in #106): the increment
                happens during lifespan shutdown, after the listening socket has
                closed, so Prometheus never scrapes the post-increment value and
                this alert is expected to stay silent even on a real timeout. Its
                absence is NOT evidence of a clean drain.
                USE THE LOG INSTEAD: the producer emits a structured WARNING keyed
                event="drain_timeout" (parallax.server.lifespan.DRAIN_TIMEOUT_EVENT)
                carrying inflight_count and timeout_seconds. That key is the
                supported match target — match on it rather than on the message
                prose, which is free to change. Wiring it to a destination is
                deliberately left open (#106 policy deferral).

  # -------------------------------------------------------------------------
  # 16. SILENT when every drain completed cleanly. Kills the >= 0 mutant, as
  #     case 10 does for the breaker.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: drain timeout silent when drains complete cleanly
    input_series:
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: DrainTimeoutDetected
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 17. SILENT once the timeout has aged out of the 1h window. Kills the
  #     window-widening mutant and the drop-increase()-for-a-level-test mutant,
  #     as case 11 does for the breaker.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: drain timeout silent once the event ages out of the window
    input_series:
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x60 1+0x60'
    alert_rule_test:
      - eval_time: 121m
        alertname: DrainTimeoutDetected
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 18. Drain-timeout half of the exposition contract — same demonstration as
  #     case 12. Absent until the first timeout, and the CRITICAL alert stays
  #     silent straight through it.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: absent-until-first-increment counter cannot fire the drain alert
    input_series:
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '_x60 1+0x60'
    alert_rule_test:
      - eval_time: 70m
        alertname: DrainTimeoutDetected
        exp_alerts: []
      - eval_time: 90m
        alertname: DrainTimeoutDetected
        exp_alerts: []
      - eval_time: 115m
        alertname: DrainTimeoutDetected
        exp_alerts: []

  # -------------------------------------------------------------------------
  # 19. PER-INSTANCE, as case 13. A drain timeout on one replica must not be
  #     diluted by peers that shut down cleanly, and the firing alert has to
  #     name the replica whose connections were force-cut.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: drain timeout names the affected replica and spares healthy peers
    input_series:
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x60 1+0x60'
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.2:8765"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: DrainTimeoutDetected
        exp_alerts:
          - exp_labels:
              severity: critical
              component: parallax_dual_read
              job: parallax
              instance: 10.0.0.1:8765
            exp_annotations:
              summary: Graceful drain timeout occurred
              description: |
                Lifespan drain handler hit the 15-minute timeout — in-flight requests
                were force-cut. Investigate stuck connections or upstream blocks.
                KNOWN LATENT (#102 review, re-measured in #106): the increment
                happens during lifespan shutdown, after the listening socket has
                closed, so Prometheus never scrapes the post-increment value and
                this alert is expected to stay silent even on a real timeout. Its
                absence is NOT evidence of a clean drain.
                USE THE LOG INSTEAD: the producer emits a structured WARNING keyed
                event="drain_timeout" (parallax.server.lifespan.DRAIN_TIMEOUT_EVENT)
                carrying inflight_count and timeout_seconds. That key is the
                supported match target — match on it rather than on the message
                prose, which is free to change. Wiring it to a destination is
                deliberately left open (#106 policy deferral).

  # -------------------------------------------------------------------------
  # 20. THE PRODUCTION SHAPE — and it is SILENT. (#102 review P1-2.)
  #
  #     Cases 15 and 19 above prove the rule's LOGIC is right: given a series
  #     that steps 0 -> 1 and keeps being scraped, the alert fires. Production
  #     cannot produce that series, and this case is the honest model.
  #
  #     Measured on uvicorn 0.52.1 against a real server: during lifespan
  #     shutdown -- where _drain_inflight runs and where drain_timeout_total is
  #     incremented -- the listening socket is already closed. Scrapes from
  #     inside that window returned ConnectTimeout, and a bare TCP connect to
  #     the port timed out. The process then exits.
  #
  #     So what Prometheus actually records is: 0 for the whole life of the
  #     process, then the target disappears. The increment is real and is
  #     never exported. `_` here is exactly that -- no sample, because there is
  #     no longer a server to scrape.
  #
  #     increase() over that sees no step, and DrainTimeoutDetected stays
  #     silent through the very event it exists for. This case asserts that
  #     silence so the gap is pinned in CI rather than described in a comment
  #     someone may not read. It should start FAILING the day a durable
  #     producer is added -- that is the signal the fix landed.
  #
  #     Note what this rules OUT: moving the increment earlier in the drain
  #     does not help, because the entire drain runs inside the same
  #     already-unserved window. A counter owned by the terminating exporter
  #     cannot report its own termination.
  # -------------------------------------------------------------------------
  - interval: 1m
    name: production shape (increment never scraped) leaves the alert silent
    input_series:
      # 0 for the life of the process, then the exporter is gone. The drain
      # timeout increments somewhere in the gap and is never sampled.
      - series: 'parallax_drain_timeout_total{job="parallax",instance="10.0.0.1:8765"}'
        values: '0+0x60 _x60'
    alert_rule_test:
      - eval_time: 61m
        alertname: DrainTimeoutDetected
        exp_alerts: []
      - eval_time: 70m
        alertname: DrainTimeoutDetected
        exp_alerts: []
      - eval_time: 90m
        alertname: DrainTimeoutDetected
        exp_alerts: []
    promql_expr_test:
      # A flat zero while the target was up, then nothing at all. Neither is a
      # signal that a drain timed out.
      - expr: increase(parallax_drain_timeout_total[1h])
        eval_time: 55m
        exp_samples:
          - labels: '{instance="10.0.0.1:8765", job="parallax"}'
            value: 0
