name: prometheus-rules-check

on:
  pull_request:
    paths:
      - "prometheus/rules/**"
      - "prometheus/tests/**"

permissions:
  contents: read

jobs:
  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Prometheus tools
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus

      - name: Check Prometheus rules
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(prometheus/rules/**/*.yml prometheus/rules/**/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Prometheus rule files found under prometheus/rules/ — workflow trigger and rule directory are out of sync."
            exit 1
          fi
          echo "Checking ${#files[@]} rule file(s):"
          printf '  %s\n' "${files[@]}"
          promtool check rules "${files[@]}"

      - name: Unit-test Prometheus rules
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          tests=(prometheus/tests/**/*.test.yml prometheus/tests/**/*.test.yaml)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No Prometheus rule unit-test files found under prometheus/tests/ — expected at least the issue #76 recording-rule test."
            exit 1
          fi
          echo "Running ${#tests[@]} rule unit-test file(s):"
          printf '  %s\n' "${tests[@]}"
          promtool test rules "${tests[@]}"
