[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-kernel"
version = "0.6.0"
description = "Parallax Kernel — content-addressed canonical knowledge base with session continuity."
requires-python = ">=3.11"
authors = [{ name = "Chris" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "python-ulid>=2.0",
    "python-dotenv>=1.0",
    "typing-extensions>=4.0",
    "tenacity>=8",
    "pydantic>=2",
    "prometheus_client>=0.20",
    "aphelion @ git+https://github.com/Chris97924/Aphelion-Graph.git@0a0e0905a7d3e765f0aa7273628fea62317d7ee8",
]

[project.scripts]
parallax = "parallax.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "black>=24",
    "isort>=5",
    "ruff>=0.5",
    "moto[s3]>=5",
    "boto3>=1.34",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6",
]
extract = [
    "httpx>=0.27",
]
cloud = [
    "boto3>=1.34",
]
llm = [
    "google-genai>=1.0",
]

[tool.setuptools.packages.find]
include = ["parallax*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=parallax --cov-report=term-missing --cov-fail-under=80 -m 'not llm_integration'"
markers = [
    "llm_integration: hits a real LLM provider (OpenRouter). Skipped by default; run with -m llm_integration and OPENROUTER_API_KEY set.",
    "unit: fast, deterministic, no I/O (Apex M5 envelope/audit_writer + future unit suites)",
    "integration: requires external resources (DB, network, filesystem state across processes)",
]

[tool.coverage.run]
source = ["parallax"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# "S" (flake8-bandit) is intentionally NOT enabled yet: enabling it
# exposes ~15 pre-existing violations in files outside Phase 3 scope
# (backup.py, introspection.py, telemetry.py, validators.py, restore.py,
# plus several test files). Plan to turn it on in a dedicated repo-wide
# cleanup pass so reviewers can audit each site in isolation.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires ``Depends(...)`` in argument
# defaults; B008 flags it as a function call in defaults. Treat it as an
# immutable call so the documented FastAPI pattern stays lint-clean.
extend-immutable-calls = ["fastapi.Depends"]
